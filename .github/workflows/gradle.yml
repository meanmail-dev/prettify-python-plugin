name: Main

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free space for IDE distributions
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 21
      - name: Test, build and verify compatibility
        run: xvfb-run -a ./gradlew test build buildPlugin verifyPlugin
